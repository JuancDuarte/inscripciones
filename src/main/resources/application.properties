spring.application.name=inscripciones
# ---- Datasource (PostgreSQL levantado con docker-compose.yml, propio de este módulo) ----
spring.datasource.url=jdbc:postgresql://localhost:5434/inscripciones_db
spring.datasource.username=inscripciones_user
spring.datasource.password=inscripciones-pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# update: crea/actualiza tablas automáticamente a partir de las entidades (útil en desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Swagger / OpenAPI (springdoc) ----
# UI disponible en: http://localhost:8082/swagger-ui.html
# JSON del contrato en: http://localhost:8082/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Puerto propio del módulo (no debe chocar con Estudiantes, Inscripciones ni el Gateway)
server.port=8082
